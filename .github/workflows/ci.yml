name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: lint · types · tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts

      - name: Types (mypy strict)
        run: mypy

      - name: Tests (coverage gate 80%)
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

      - name: Public safety scan
        run: python scripts/public_safety_scan.py

  pre-commit:
    name: pre-commit (full repo)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # Runs every hook in .pre-commit-config.yaml against every tracked file, not just
      # staged ones — catching anything a contributor's local hooks might have missed.
      - uses: pre-commit/action@v3.0.1
